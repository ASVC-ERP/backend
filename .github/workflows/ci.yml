name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --frozen-lockfile fails if package.json and bun.lock disagree — the
      # drift that silently broke the build earlier this session.
      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun run test
